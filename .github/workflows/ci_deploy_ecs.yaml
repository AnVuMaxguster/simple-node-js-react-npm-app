name: CI | Build image | Deploy to ECS

on:
  push:
    branches:
      - master

    paths-ignore:
      # Ignore changes to documentation
      - 'docs/**'
      - '**.md'
      - '**.txt'
      - 'CHANGELOG*'
      - 'LICENSE*'

      - ".gitignore"

  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  # ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  # ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  # ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
  # CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}

jobs:
  # Check which files have changes on trigger, used for some conditional jobs/steps.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      dockerfile: ${{ steps.filter.outputs.dockerfile }}
    steps:
    # For pull requests it's not necessary to checkout the code
    - name: Checkout source
      uses: actions/checkout@v6

    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          app:
            - 'src/**'
            - 'index.html'
            - 'public/**'
            - 'package.json'
            - 'package-lock.json'
            - 'vite.config.js'
          dockerfile:
            - 'Dockerfile'
            - '.dockerignore'
     
  project-scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Run Trivy vulnerability, secret & misconfiguration scan on project
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: .
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

          # Setting for vuln scanner: Scan language-specific packages.
          vuln-type: 'library'

          # By adding 'misconfig', IaC files (e.g Dockerfile) in the dir will also be scanned.
          scanners: 'vuln,secret,misconfig'

      - name: Upload filesystem scan to GitHub Security
        # Upload results even when scan fails (exit 1)
        if: always()

        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs-results.sarif

  test-and-build:
    name: Test and build Node app
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '21.x'

          # Save cached packages between runners (especially ephemeral GitHub runners).
          # Uses actions/cache under the hood.
          cache: npm 

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

      - name: Build app
        run: npm run build --if-present


      # UPLOAD ARTIFACT TO GITHUB ACTION'S STORAGE / EXTERNAL STORAGE.

      # - name: (Action Storage) Upload build artifact
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: web-assets
      #     path: build/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: (S3) Upload build artifact
        run: |
          aws s3 sync ./build s3://${{ secrets.S3_BUCKET_NAME }}/ \
            --delete \
            --acl private

  docker-and-scan:
    name: Build Docker image and Trivy image scan
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    needs: [changes, test-and-build, project-scan]
    # Always build docker image whether app code changes or only Dockerfile changes.
    if: >-
      always() &&
      ( needs.test-and-build.result == 'success' && needs.project-scan.result == 'success') ||
      ( needs.test-and-build.result == 'skipped' && needs.changes.outputs.dockerfile == 'true' )
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Docker image metadata
        id: meta
        shell: bash
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      # DOWNLOAD ARTIFACT FROM GITHUB ACTION'S STORAGE / EXTERNAL STORAGE.

      # - name: (Action Storage) Download build artifact
      #   uses: actions/download-artifact@v8
      #   with:
      #     name: web-assets
      #     path: build/

      - name: (S3) Download build artifact
        run: |
          mkdir -p ./build
          aws s3 sync s3://${{ secrets.S3_BUCKET_NAME }}/ ./build

      - name: Build Docker image
        run: docker build -t ${{ steps.meta.outputs.image_uri }} .

      - name: Run Trivy vulnerability & secret scan on image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ steps.meta.outputs.image_uri }}
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

          # Setting for vuln scanner: Scan OS packages & language-specific packages.
          vuln-type: 'os,library'

          scanners: 'vuln,secret'

      - name: Upload Trivy scan to GitHub Security
        # Upload results even when scan fails (exit 1)
        if: always()

        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image-results.sarif

      - name: Push Docker image to ECR
        run: docker push ${{ steps.meta.outputs.image_uri }}

