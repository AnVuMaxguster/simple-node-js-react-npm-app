name: CI | Build image | Deploy to ECS

on:
  push:
    branches:
      - master

    paths-ignore:
      # Ignore changes to certain files.
      - 'docs/**'
      - '**.md'
      - '**.txt'
      - 'CHANGELOG*'
      - 'LICENSE*'
      - '.gitignore'
      - '.github/workflows/**'

      # (!) Prevent workflow execution completely.
      # - '**'

  workflow_dispatch:
    inputs:
      # (For testing) Choose jobs to run.
      run_code:
        description: "Run code tests, scan & build"
        type: boolean
        default: false

      run_image:
        description: "Run image scan & build"
        type: boolean
        default: false

      run_deploy:
        description: "Run deploy"
        type: boolean
        default: false

permissions:
  contents: read
  # Sarif upload
  security-events: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}

  S3_ARTIFACT_PREFIX: "${{ vars.ECR_REPOSITORY }}/"

jobs:
  # Check which files have changes on trigger, used for some conditional jobs/steps.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      dockerfile: ${{ steps.filter.outputs.dockerfile }}
    steps:
    # For pull requests it's not necessary to checkout the code
    - name: Checkout source
      uses: actions/checkout@v6

    - uses: dorny/paths-filter@v4
      id: filter
      with:
        # (!) Only apply to push events, might need to compute dynamic values if workflow accepts multiple event types.
        # This means: compute diff between HEAD before push vs current HEAD of the same branch.
        base: ${{ github.ref }}
      
        filters: |
          app:
            - 'src/**'
            - 'index.html'
            - 'public/**'
            - 'package.json'
            - 'package-lock.json'
            - 'vite.config.js'
          dockerfile:
            - 'Dockerfile'
            - '.dockerignore'
     
  project-scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      (github.event_name == 'push' && needs.changes.outputs.app == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_code)
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Run Trivy vulnerability, secret & misconfiguration scan on project
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: .
          format: 'sarif'
          output: 'trivy-fs-results.sarif'

          # By default SARIF format enforces output of all vulnerabilities regardless of configured severities
          limit-severities-for-sarif: true 

          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

          # Setting for vuln scanner: Scan language-specific packages.
          vuln-type: 'library'

          # By adding 'misconfig', IaC files (e.g Dockerfile) in the fs will also be scanned.
          scanners: 'vuln,secret,misconfig'
          
          trivyignores: '.trivyignore'

      - name: Upload filesystem scan to GitHub Security
        # Upload results even when scan fails (exit 1)
        if: always()

        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs-results.sarif

  test-and-build:
    name: Test and build Node app
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      (github.event_name == 'push' && needs.changes.outputs.app == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_code)
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # LTS versions recommended
          node-version: '22.x'

          # Caches packages in ~/.npm between jobs/runs for faster workflow speed.
          # Uses actions/cache under the hood.
          # (!) Cache only saves once this whole job succeeds.
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build app
        run: npm run build

      # UPLOAD ARTIFACT TO GITHUB ACTION'S STORAGE / EXTERNAL STORAGE.

      # - name: (Action Storage) Upload build artifact
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: web-assets
      #     path: build/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: (S3) Upload build artifact
        run: |
          aws s3 sync ./build s3://${{ secrets.S3_BUCKET_NAME }}/${{ env.S3_ARTIFACT_PREFIX}} \
            --delete

  docker-and-scan:
    name: Build Docker image and Trivy image scan
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.meta.outputs.image_uri }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    needs: [changes, test-and-build, project-scan]
    # Always build docker image whether app code changes or only Dockerfile changes.
    if: >-
      always() && (
        (github.event_name == 'push' && (
          (needs.test-and-build.result == 'success' && needs.project-scan.result == 'success') ||
          (needs.test-and-build.result == 'skipped' && needs.changes.outputs.dockerfile == 'true')
        )) ||
        (github.event_name == 'workflow_dispatch' && inputs.run_image)
      )
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          # Recommend to set up Github Action OIDC with AWS IAM & assume IAM role to authenticate 
          # instead of long-live user access key.
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Docker image metadata
        id: meta
        shell: bash
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      # DOWNLOAD ARTIFACT FROM GITHUB ACTION'S STORAGE / EXTERNAL STORAGE.

      # - name: (Action Storage) Download build artifact
      #   uses: actions/download-artifact@v8
      #   with:
      #     name: web-assets
      #     path: build/

      - name: (S3) Download build artifact
        run: |
          mkdir -p ./build
          aws s3 sync s3://${{ secrets.S3_BUCKET_NAME }}/${{ env.S3_ARTIFACT_PREFIX }} ./build

      - name: Verify build artifact is not empty
        run: |
          if [ ! -d ./build ] || [ -z "$(find ./build -mindepth 1 -print -quit)" ]; then
            echo "::error::build/ is missing or empty after S3 sync. Run test-and-build first or check S3_BUCKET_NAME / S3_ARTIFACT_PREFIX."
            exit 1
          fi
          echo "build/ artifact OK ($(find ./build -type f | wc -l) file(s))"

      - name: Build Docker image
        run: |
          docker build \
          -t ${{ steps.meta.outputs.image_uri }}:${{ steps.meta.outputs.image_tag }} \
          -t ${{ steps.meta.outputs.image_uri }}:latest \
          .

      - name: Run Trivy vulnerability & secret scan on image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ steps.meta.outputs.image_uri }}
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          
          # By default SARIF format enforces output of all vulnerabilities regardless of configured severities
          limit-severities-for-sarif: true 

          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

          # Setting for vuln scanner: Scan OS packages & language-specific packages.
          vuln-type: 'os,library'

          scanners: 'vuln,secret'
          trivyignores: '.trivyignore-image'

      - name: Upload Trivy scan to GitHub Security
        # Upload results even when scan fails (exit 1)
        if: always()

        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image-results.sarif

      - name: Push Docker image to ECR
        run: docker push --all-tags ${{ steps.meta.outputs.image_uri }}

  deploy-to-ecs:
    name: Deploy image to ECS
    runs-on: ubuntu-latest
    needs: docker-and-scan
    if: >-
      always() && (
        (github.event_name == 'push' && needs.docker-and-scan.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.run_deploy)
      )
    env:
      # This file should be stored in a dedicated deployment repo.
      ECS_TASK_DEFINITION: 'aws/ecs_task-def.json'
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        id: aws-cred
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          output-credentials: true

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

        # Either using the output from the build step or reconstructing it.
      - name: Set deployment image URI
        id: image
        shell: bash
        run: |
          IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      # Supplemental step: some configs can't be rendered by aws-actions/amazon-ecs-render-task-definition
      # So here we render manually using jq tool.
      - name: (Supplemental) Render task definition file 
        env:
          EXECUTION_ROLE_ARN: "arn:aws:iam::${{ steps.aws-cred.outputs.aws-account-id }}:role/ecsTaskExecutionRole"
        run: |
          jq \
            --arg executionRoleArn "${EXECUTION_ROLE_ARN}" \
            '.executionRoleArn = $executionRoleArn' \
            ${ECS_TASK_DEFINITION} > task-def.tmp.json && mv task-def.tmp.json ${ECS_TASK_DEFINITION}

      # (*) Task includes a single container
      - name: Render ECS task definition with new image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        env:
          CONTAINER_LOG_DRIVER: awslogs
          CONTAINER_AWS_LOG_REGION: ${{ env.AWS_REGION }}
          CONTAINER_AWS_LOG_GROUP: /ecs/${{ env.ECS_CLUSTER }}
          CONTAINER_AWS_LOG_STREAM_PREFIX: ${{ env.ECS_SERVICE }}
        with:
          # (!) Container name has to be already set in the ECS Task Definition. The actionn can't create/overwrite it.
          container-name: 'main-app'

          task-definition: ${{ env.ECS_TASK_DEFINITION }}

          image: ${{ steps.image.outputs.image_uri }}
          # Alternatively, use the outputs from the build job, reduce ECR call and URI construct steps.
          # image: "${{ needs.docker-and-scan.outputs.image_uri }}:${{ needs.docker-and-scan.outputs.image_tag }}"

          log-configuration-log-driver: awslogs
          log-configuration-options: |
            awslogs-create-group=true
            awslogs-group=${CONTAINER_AWS_LOG_GROUP}
            awslogs-region=${CONTAINER_AWS_LOG_GROUP}
            awslogs-stream-prefix=${CONTAINER_AWS_LOG_GROUP}

      - name: debug
        run:
          cat ${ECS_TASK_DEFINITION}

      - name: Deploy ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
